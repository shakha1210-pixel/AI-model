<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Parolni tiklash — Apeiron</title>
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.setAttribute("data-accent", localStorage.getItem("accent") || "teal");
      document.documentElement.setAttribute("data-font", localStorage.getItem("font") || "sans");
    })();
  </script>
  <script src="i18n.js?v=11"></script>
  <link rel="icon" type="image/jpeg" href="app_logo.jfif" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0c11" />
  <script src="register-sw.js?v=11"></script>
  <link rel="stylesheet" href="style.css?v=11" />
</head>
<body>

  <div class="auth-topbar">
    <a class="brand" href="index.html">Apeiron</a>
  </div>

  <div class="auth-page">
    <form id="forgot-form" class="auth-card">
      <p class="auth-card__eyebrow" data-i18n="auth.forgot.eyebrow">Parolni tiklash</p>
      <h1 data-i18n="auth.forgot.title">Parolingizni unutdingizmi?</h1>
      <p class="auth-note" data-i18n="auth.forgot.note">
        Emailingizni kiriting — agar u ro'yxatdan o'tgan bo'lsa, parolni tiklash havolasini yuboramiz.
      </p>
      <label>
        <span data-i18n="auth.email">Email</span>
        <input type="email" id="email" data-i18n-placeholder="auth.emailPlaceholder" placeholder="siz@misol.uz" required />
      </label>
      <button type="submit" class="btn btn--primary btn--block" data-i18n="auth.forgot.submit">Havola yuborish</button>
      <p class="auth-switch">
        <a href="login.html" data-i18n="auth.forgot.backToLogin">Kirishga qaytish</a>
      </p>
      <p id="auth-error" class="auth-error"></p>
      <p id="auth-success" class="auth-note" hidden></p>
    </form>
  </div>

  <script src="ascii-bg.js?v=11"></script>
  <script src="theme.js?v=11"></script>
  <script>
    document.getElementById("forgot-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const errorEl = document.getElementById("auth-error");
      const successEl = document.getElementById("auth-success");
      errorEl.textContent = "";
      successEl.hidden = true;

      try {
        const response = await fetch("/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || I18N.t("auth.error.loginFailed"));
        }
        successEl.textContent = data.message || I18N.t("auth.forgot.sent");
        successEl.hidden = false;
      } catch (error) {
        errorEl.textContent = error.message;
      }
    });
  </script>
</body>
</html>
