<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kirish — Apeiron</title>
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.setAttribute("data-accent", localStorage.getItem("accent") || "teal");
      document.documentElement.setAttribute("data-font", localStorage.getItem("font") || "sans");
    })();
  </script>
  <script src="i18n.js"></script>
  <link rel="icon" type="image/jpeg" href="app_logo.jfif" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  

  <div class="auth-topbar">
    <a class="brand" href="index.html">Apeiron</a>
  </div>

  <div class="auth-page">
    <form id="login-form" class="auth-card">
      <p class="auth-card__eyebrow" data-i18n="auth.login.eyebrow">Avtorizatsiya</p>
      <h1 data-i18n="auth.login.title">Kirish</h1>
      <p class="auth-note" data-i18n="auth.login.note">
        Eslatma: bu forma faqat backend'da ENABLE_AUTH=true qilinganda ishlaydi
        (main.py va .env fayliga qarang).
      </p>
      <label>
        <span data-i18n="auth.email">Email</span>
        <input type="email" id="email" data-i18n-placeholder="auth.emailPlaceholder" placeholder="siz@misol.uz" required />
      </label>
      <label>
        <span data-i18n="auth.password">Parol</span>
        <input type="password" id="password" placeholder="••••••••" required />
      </label>
      <button type="submit" class="btn btn--primary btn--block" data-i18n="auth.login.submit">Kirish</button>

      <div class="auth-divider"><span data-i18n="auth.or">yoki</span></div>

      <a href="/auth/google/login" class="btn btn--google btn--block">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 16.1 3 9.3 7.5 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36.4 26.7 37 24 37c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.2 40.4 16 45 24 45z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C40.9 36 44 30.6 44 24c0-1.4-.1-2.7-.4-3.5z"/>
        </svg>
        <span data-i18n="auth.google">Google orqali kirish</span>
      </a>

      <p class="auth-switch">
        <span data-i18n="auth.login.switchText">Hisobingiz yo'qmi?</span>
        <a href="register.html" data-i18n="auth.login.switchLink">Ro'yxatdan o'ting</a>
      </p>
      <p id="auth-error" class="auth-error"></p>
    </form>
  </div>

  <script src="ascii-bg.js"></script>
  <script src="theme.js"></script>
  <script>
    // Google orqali kirgandan keyin backend shu sahifaga ?exchange_code=...
    // bilan qaytaradi (xavfsizlik uchun to'liq token emas, faqat bir
    // martalik qisqa muddatli kod). Shu kodni /auth/google/exchange orqali
    // haqiqiy tokenga almashtiramiz.
    (function () {
      const params = new URLSearchParams(window.location.search);
      const exchangeCode = params.get("exchange_code");
      if (exchangeCode) {
        // URL'dan kodni darhol tozalaymiz (brauzer tarixida qolib
        // ketmasligi uchun) va so'ng serverdan tokenni so'raymiz.
        window.history.replaceState({}, document.title, window.location.pathname);
        fetch("/auth/google/exchange", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: exchangeCode }),
        })
          .then((res) => {
            if (!res.ok) throw new Error("Kod almashtirishda xatolik");
            return res.json();
          })
          .then((data) => {
            localStorage.setItem("access_token", data.access_token);
            window.location.href = "index.html";
          })
          .catch(() => {
            document.getElementById("auth-error").textContent = I18N.t("auth.error.googleFailed");
          });
      }
    })();

    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("auth-error");
      errorEl.textContent = "";

      try {
        const body = new URLSearchParams();
        body.set("username", email);
        body.set("password", password);

        const response = await fetch("/auth/login", { method: "POST", body });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.detail || I18N.t("auth.error.loginFailed"));
        }
        const data = await response.json();
        localStorage.setItem("access_token", data.access_token);
        localStorage.setItem("user_email", email);
        window.location.href = "index.html";
      } catch (error) {
        errorEl.textContent = error.message;
      }
    });
  </script>
</body>
</html>
