<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yangi parol — Apeiron</title>
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.setAttribute("data-accent", localStorage.getItem("accent") || "teal");
      document.documentElement.setAttribute("data-font", localStorage.getItem("font") || "sans");
    })();
  </script>
  <script src="i18n.js?v=9"></script>
  <link rel="icon" type="image/jpeg" href="app_logo.jfif" />
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>

  <div class="auth-topbar">
    <a class="brand" href="index.html">Apeiron</a>
  </div>

  <div class="auth-page">
    <form id="reset-form" class="auth-card">
      <p class="auth-card__eyebrow" data-i18n="auth.reset.eyebrow">Yangi parol</p>
      <h1 data-i18n="auth.reset.title">Yangi parol o'rnating</h1>
      <p class="auth-note" data-i18n="auth.reset.note">
        Havola 1 soat amal qiladi. Yangi parolingizni kiriting.
      </p>
      <div id="reset-fields">
        <label>
          <span data-i18n="auth.reset.newPassword">Yangi parol</span>
          <input type="password" id="new-password" data-i18n-placeholder="auth.passwordPlaceholderRegister" placeholder="kamida 6 belgi" required minlength="6" />
        </label>
        <button type="submit" class="btn btn--primary btn--block" data-i18n="auth.reset.submit">Parolni o'rnatish</button>
      </div>
      <p class="auth-switch">
        <a href="login.html" data-i18n="auth.forgot.backToLogin">Kirishga qaytish</a>
      </p>
      <p id="auth-error" class="auth-error"></p>
      <p id="auth-success" class="auth-note" hidden></p>
    </form>
  </div>

  <script src="ascii-bg.js?v=9"></script>
  <script src="theme.js?v=9"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const formEl = document.getElementById("reset-form");
    const fieldsEl = document.getElementById("reset-fields");
    const errorEl = document.getElementById("auth-error");
    const successEl = document.getElementById("auth-success");

    if (!token) {
      fieldsEl.hidden = true;
      errorEl.textContent = I18N.t("auth.reset.missingToken");
    }

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const newPassword = document.getElementById("new-password").value;
      errorEl.textContent = "";
      successEl.hidden = true;

      try {
        const response = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: newPassword }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || I18N.t("auth.error.loginFailed"));
        }
        successEl.textContent = data.message || I18N.t("auth.reset.done");
        successEl.hidden = false;
        fieldsEl.hidden = true;
        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);
      } catch (error) {
        errorEl.textContent = error.message;
      }
    });
  </script>
</body>
</html>
