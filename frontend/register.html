<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ro'yxatdan o'tish — Apeiron</title>
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.setAttribute("data-accent", localStorage.getItem("accent") || "teal");
      document.documentElement.setAttribute("data-font", localStorage.getItem("font") || "sans");
    })();
  </script>
  <script src="i18n.js?v=4"></script>
  <link rel="icon" type="image/jpeg" href="app_logo.jfif" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  

  <div class="auth-topbar">
    <a class="brand" href="index.html">Apeiron</a>
  </div>

  <div class="auth-page">
    <form id="register-form" class="auth-card">
      <p class="auth-card__eyebrow" data-i18n="auth.register.eyebrow">Yangi hisob</p>
      <h1 data-i18n="auth.register.title">Ro'yxatdan o'tish</h1>
      <p class="auth-note" data-i18n="auth.register.note">
        Eslatma: bu forma faqat backend'da ENABLE_AUTH=true va
        ENABLE_DATABASE=true qilinganda ishlaydi (main.py va .env fayliga
        qarang).
      </p>
      <label>
        <span data-i18n="auth.name">Ism</span>
        <input type="text" id="ism" data-i18n-placeholder="auth.namePlaceholder" placeholder="Ismingiz" required />
      </label>
      <label>
        <span data-i18n="auth.email">Email</span>
        <input type="email" id="email" data-i18n-placeholder="auth.emailPlaceholder" placeholder="siz@misol.uz" required />
      </label>
      <label>
        <span data-i18n="auth.password">Parol</span>
        <input type="password" id="password" data-i18n-placeholder="auth.passwordPlaceholderRegister" placeholder="kamida 6 belgi" required minlength="6" />
      </label>
      <label class="auth-check">
        <input type="checkbox" id="accepted-terms" required />
        <span>
          <span data-i18n="auth.terms.prefix"></span>
          <a href="terms.html" target="_blank" rel="noopener" data-i18n="auth.terms.link">Foydalanish shartlari</a><span data-i18n="auth.terms.suffix">ga roziman</span>
        </span>
      </label>

      <button type="submit" class="btn btn--primary btn--block" data-i18n="auth.register.submit">Ro'yxatdan o'tish</button>
      <p class="auth-switch">
        <span data-i18n="auth.register.switchText">Hisobingiz bormi?</span>
        <a href="login.html" data-i18n="auth.register.switchLink">Kiring</a>
      </p>
      <p id="auth-error" class="auth-error"></p>
    </form>
  </div>

  <script src="ascii-bg.js?v=4"></script>
  <script src="theme.js?v=4"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const ism = document.getElementById("ism").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const acceptedTerms = document.getElementById("accepted-terms").checked;
      const errorEl = document.getElementById("auth-error");
      errorEl.textContent = "";

      try {
        const response = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ism, email, password, accepted_terms: acceptedTerms }),
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.detail || I18N.t("auth.error.registerFailed"));
        }
        const data = await response.json();
        localStorage.setItem("access_token", data.access_token);
        localStorage.setItem("user_name", ism);
        localStorage.setItem("user_email", email);
        window.location.href = "index.html";
      } catch (error) {
        errorEl.textContent = error.message;
      }
    });
  </script>
</body>
</html>
