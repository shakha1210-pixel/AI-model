name: Bug report
description: Report a reproducible problem in Apeiron.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Apeiron. Never include API keys, passwords, or private user data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Select ...\n3. See error ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, Python version, deployment type
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact tokens, keys, emails, and other sensitive data.
