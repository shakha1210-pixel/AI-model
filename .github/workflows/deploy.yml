name: Test va Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt
      - name: Testlarni ishga tushirish
        run: pytest -v

